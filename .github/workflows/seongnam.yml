name: Seongnam City Hall review candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '47 21 * * *'
  push:
    paths:
      - 'seongnam_collector.py'
      - 'test_seongnam_collector.py'
      - '.github/workflows/seongnam.yml'
permissions:
  contents: write
concurrency:
  group: seongnam-city-hall
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify date and eligibility handling
        run: python -m unittest test_seongnam_collector -v
      - name: Collect current and next month
        run: python seongnam_collector.py --months 2 --output output/seongnam.json
      - name: Publish Seongnam-only candidate feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("output/seongnam.json").read_text())
          feed = {k:d[k] for k in ("source","checked_at","selection","sample_is_not_complete","partial_scan","scan_complete","errors","candidates")}
          Path("data").mkdir(exist_ok=True)
          Path("data/seongnam-candidates.json").write_text(json.dumps(feed,ensure_ascii=False,indent=2))
          print("Seongnam candidates:",len(feed["candidates"]))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seongnam-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Seongnam tomorrow-registration and month event candidates'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: seongnam-review-candidates
          path: output/seongnam.json
          if-no-files-found: error
          retention-days: 14
