name: Refresh upcoming reservation candidates
on:
  # Seoul collection paused while Seongnam is active.
  # schedule:
  #   - cron: '37 21 * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/candidates.yml']
permissions:
  contents: write
concurrency:
  group: upcoming-candidate-feed
  cancel-in-progress: false
jobs:
  collect:
    if: ${{ false }} # Temporarily pause Seoul even on manual/push runs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - name: Collect full feed
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collector.py
      - name: Publish public candidate snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('output/reservations.json').read_text())
          if d['sample_is_not_complete']:
              raise RuntimeError('Sample cannot replace full feed')
          fields = ('id','title','audience','grade_status','place','district','fee_label','registration_start','registration_end','event_start','event_end','booking_url','checked_at','candidate','description')
          candidates = [{k: r.get(k) for k in fields} for r in d['candidates']]
          out = {k: d[k] for k in ('checked_at','sample_is_not_complete','selection')}
          out['candidates'] = candidates
          Path('data').mkdir(exist_ok=True)
          Path('data/candidates.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print('Upcoming candidate count:', len(candidates))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public upcoming registration candidates'
            git push
          fi
